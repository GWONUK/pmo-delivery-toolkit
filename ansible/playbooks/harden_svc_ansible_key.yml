---
- name: Harden Ansible managed SSH key
  hosts: k8s_nodes
  gather_facts: false
  become: true
  serial: 1
  vars:
    automation_authorized_keys: /home/automation/.ssh/authorized_keys
    automation_key_comment: managed-automation automation
    automation_key_options: from="192.0.2.10",restrict
  pre_tasks:
  - name: Require explicit permission before remote execution
    ansible.builtin.assert:
      that:
      - toolkit_allow_remote_execution | default(false) | bool
      fail_msg: 'Public example: remote execution is disabled by default.'
    delegate_to: localhost
    become: false
    run_once: true
    tags:
    - always
  tasks:
  - name: Run reviewed tasks only after explicit opt in
    when: toolkit_allow_remote_execution | default(false) | bool
    block:
    - name: Count managed SSH keys
      ansible.builtin.command:
        argv:
        - grep
        - -cE
        - ^(from="192\.0\.2\.10",restrict )?ssh-ed25519[[:space:]]+[^[:space:]]+[[:space:]]+managed-automation automation$
        - '{{ automation_authorized_keys }}'
      register: managed_key_count
      changed_when: false
      check_mode: false
      failed_when: managed_key_count.rc not in [0, 1] or (managed_key_count.stdout | int) != 1
    - name: Preserve original authorized keys
      ansible.builtin.copy:
        src: '{{ automation_authorized_keys }}'
        dest: '{{ automation_authorized_keys }}.pre-restrict'
        remote_src: true
        owner: automation
        group: automation
        mode: '0600'
        force: false
    - name: Restrict managed SSH key
      ansible.builtin.replace:
        path: '{{ automation_authorized_keys }}'
        regexp: ^(ssh-ed25519[ \t]+\S+[ \t]+managed-automation automation)$
        replace: '{{ automation_key_options }} \1'
        backup: true
        owner: automation
        group: automation
        mode: '0600'
    - name: Verify restricted managed SSH key
      ansible.builtin.command:
        argv:
        - grep
        - -cE
        - ^from="192\.0\.2\.10",restrict ssh-ed25519[[:space:]]+[^[:space:]]+[[:space:]]+managed-automation automation$
        - '{{ automation_authorized_keys }}'
      register: p1_restricted_key_count
      changed_when: false
      failed_when: p1_restricted_key_count.rc != 0 or (p1_restricted_key_count.stdout | int) != 1
