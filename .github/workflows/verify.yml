name: Public example verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-and-localhost:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -r requirements-ansible.txt
      - name: Python mock and synthetic Git tests
        run: python -m unittest discover -s python -p 'test_*.py' -v
      - name: Public content and source provenance
        run: python scripts/check_public_tree.py
      - name: Ansible syntax and synthetic localhost guards
        run: python scripts/verify_ansible.py
